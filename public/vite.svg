<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#071228" />
    </linearGradient>
    <linearGradient id="emeraldGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0052FF" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- High-contrast rounded dark backdrop for tab visibility -->
  <rect width="64" height="64" rx="14" fill="#060c18" />

  <!-- Shield Element -->
  <g transform="translate(7, 6)">
    <!-- Primary Shield Shape -->
    <path d="M25,2 C38,2 45,7 45,18 C45,33 30,48 25,50 C20,48 5,33 5,18 C5,7 12,2 25,2 Z" fill="url(#shieldGradFav)" stroke="#2563EB" stroke-width="1.8" filter="url(#shadow)" />
    
    <!-- Subtle Inner Reflection Layer -->
    <path d="M25,6 C33,6 39,9 39,18 C39,28 29,38 25,41 C21,38 11,28 11,18 C11,9 17,6 25,6 Z" fill="#FFFFFF" opacity="0.12" />

    <!-- Dual Transaction Flow Arrows -->
    <!-- Forward Blue Arrow -->
    <path d="M16,22 L22,22 L22,16 L25,16 L25,25 L16,25 Z" fill="#38BDF8" transform="rotate(45, 20.5, 20.5)" />
    <!-- Return Protection Emerald Arrow -->
    <path d="M25,25 L34,25 L34,19 L31,19 L31,28 L25,28 Z" fill="url(#emeraldGradFav)" transform="rotate(225, 29.5, 23.5)" />
  </g>
</svg>
